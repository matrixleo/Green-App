<div class="home-body">
  <div class="home-screen"*ngFor="let item of projects">
    <mat-card class="example-card"*ngFor="let submen of item.submenu" >
      <mat-card-header>
        <mat-card-title>{{submen.name}}</mat-card-title>
        </mat-card-header>
        <mat-card-content>
          <p>{{submen.description}}</p>
        </mat-card-content>
        <mat-card-actions class="card-button">
          <button mat-button (click)="navigo(submen)">Go</button>
        </mat-card-actions>
      </mat-card> 
  </div>
  <mat-action-row>
  <button [routerLink]="['/projects/form']" mat-fab color="basic" >
    <mat-icon>add</mat-icon>
  </button>
  </mat-action-row>
</div>
