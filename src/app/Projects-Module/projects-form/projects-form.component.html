<div class="body">
  <h1>Add Project</h1>
  <mat-stepper style="max-height: 50vh; overflow: auto; overflow-x: hidden;" [linear]="true" #stepper >
    <mat-step [stepControl]="projectForm" label="Project">
      <form class="example-form" [formGroup]="projectForm">  
        
        <mat-form-field class="example-full-width">
                    <mat-label>Name</mat-label>
                    <input matInput  formControlName="name">
                  </mat-form-field>
                
                <mat-form-field class="example-full-width">
                    <mat-label>Abbreviation</mat-label>
                    <input matInput formControlName="abbreviation">
                </mat-form-field>
                
                <mat-form-field appearance="fill">
                  <mat-label>Select</mat-label>
                  <mat-select formControlName="projectType">
                      <mat-option value="RESTORATION">Restoration</mat-option>
                      <mat-option value="CONSTRUCTION">Construction</mat-option>
                      <mat-option value="ROOFING">Roofing</mat-option>
                    </mat-select>
                </mat-form-field>

                <mat-form-field class="example-full-width">
                  <mat-label>Property Name</mat-label>
                  <input matInput formControlName="propertyName">
                </mat-form-field>
        
              </form>
              <div id="btn-div">
                <button id="btn-back" mat-raised-button matStepperPrevious>Back</button>
                <button id="but" mat-raised-button matStepperNext>Next</button>
              </div>
            </mat-step>
            
            
            
            <mat-step [stepControl]="secondFormGroup" label="Details">
              <form class="example-form" [formGroup]="secondFormGroup">
                
                <mat-form-field class="example-full-width">
                  <mat-label>Street</mat-label>
                  <input matInput formControlName="street" >
                </mat-form-field>
                
                <mat-form-field class="example-full-width">
                  <mat-label>City</mat-label>
                  <input matInput formControlName="city" >
                </mat-form-field>  
                
                <mat-form-field class="example-full-width">
                  <mat-label>State</mat-label>
                  <input matInput formControlName="state" >
                </mat-form-field>
                
                
                
                <mat-form-field appearance="fill">
                  <mat-label>Job Type</mat-label>
                  <mat-select formControlName="jobType">
                    <mat-option value="Interior">Interior</mat-option>
                    <mat-option value="Exterior">Exterior</mat-option>
                  </mat-select>
                </mat-form-field>
                
                <mat-form-field class="example-full-width">
                  <mat-label>Number</mat-label>
                  <input matInput formControlName="number">
                </mat-form-field>
                
                <mat-form-field appearance="fill">
                  <mat-label>Choose a date</mat-label>
                  <input matInput [matDatepicker]="picker" formControlName="createdAt" >
                  <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
                  <mat-datepicker #picker></mat-datepicker>
                </mat-form-field>
                
              </form>
              <div id="btn-div">
                <button id="btn-back" mat-button matStepperPrevious>Back</button>
                <button id="but" mat-button matStepperNext>Next</button>
              </div>
            </mat-step>
            
            <mat-step>
              <ng-template matStepLabel>Team</ng-template>
              <form [formGroup]="form">
                <div class="forme"formArrayName="teamMembers">
                    <div class="detailsForm" *ngFor="let member of teamMembers.controls; let i = index">
                      <mat-form-field>
                        <mat-label>Name {{i+1}}</mat-label>
                        <div [formGroupName]="i">
                          <input matInput formControlName="name" placeholder="Name">
                        </div>
                      </mat-form-field>
                      <mat-form-field>
                        <mat-label>Position {{i+1}}</mat-label>
                        <div [formGroupName]="i">
                          <input matInput formControlName="position" placeholder="Position">
                        </div>
                      </mat-form-field>
                    </div>
                  <div class="butonform">
                    <button mat-mini-fab class="cl" (click)="addTeamMember()"><mat-icon>add</mat-icon></button>
                  </div>
                </div>
              </form>
              
              <div id="btn-div">
                <button id="btn-back" mat-button matStepperPrevious>Back</button>
                <button id="but" mat-raised-button matStepperNext>Next</button>
              </div>
            </mat-step>
                        
        <mat-step>
          <ng-template matStepLabel>Done</ng-template>
          <p>You are done now.</p>
          <div id="btn-div">
            <button id="btn-back" mat-button matStepperPrevious>Back</button>
            <button id="but" mat-raised-button  (click)="saveForm()">Save</button>
          </div>
        </mat-step>
      </mat-stepper>
      </div>
